<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f261c" />
    <title>Forgot Login | Hoppers</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./assets/icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=30" />
  </head>
  <body class="signin-page">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Hoppers home">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span>
          <strong>Hoppers</strong>
          <small>Good stays. Good people. Mud on boots.</small>
        </span>
      </a>
      <a class="header-signin" href="./sign-in.html">Sign in</a>
      <details class="menu-dropdown">
        <summary aria-label="Open site menu">
          <span></span>
          <span></span>
          <span></span>
        </summary>
        <nav class="dropdown-nav" aria-label="Site menu">
          <a href="./how-it-works.html">How it works</a>
          <a href="./workers.html">For workers</a>
          <a href="./hostels.html">For hostels</a>
          <a href="./find-hostels.html">Find hostels</a>
        </nav>
      </details>
    </header>

    <main>
      <section class="signin-landing compact-auth-landing">
        <div class="signin-copy">
          <p class="eyebrow">Account help</p>
          <h1>Recover your Hoppers login.</h1>
          <p>
            Enter the email you used for Hoppers. We will send your login email and a one-time password reset link.
          </p>
        </div>

        <div class="signin-card">
          <form id="forgot-form" class="account-form">
            <label>
              <span>Email</span>
              <input name="email" required type="email" autocomplete="email" placeholder="you@example.com" />
            </label>
            <button class="button button-dark" type="submit">Email reset link</button>
            <p id="forgot-status" class="form-status" role="status" aria-live="polite"></p>
          </form>
          <p class="auth-helper"><a href="./sign-in.html">Back to sign in</a></p>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./forgot-password.js?v=1"></script>
  </body>
</html>
