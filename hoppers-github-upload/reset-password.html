<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f261c" />
    <title>Reset Password | Hoppers</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./assets/icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=30" />
  </head>
  <body class="signin-page">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Hoppers home">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span>
          <strong>Hoppers</strong>
          <small>Good stays. Good people. Mud on boots.</small>
        </span>
      </a>
      <a class="header-signin" href="./sign-in.html">Sign in</a>
      <details class="menu-dropdown">
        <summary aria-label="Open site menu">
          <span></span>
          <span></span>
          <span></span>
        </summary>
        <nav class="dropdown-nav" aria-label="Site menu">
          <a href="./how-it-works.html">How it works</a>
          <a href="./workers.html">For workers</a>
          <a href="./hostels.html">For hostels</a>
          <a href="./find-hostels.html">Find work</a>
        </nav>
      </details>
    </header>

    <main>
      <section class="signin-landing compact-auth-landing">
        <div class="signin-copy">
          <p class="eyebrow">Secure reset</p>
          <h1>Set a new password.</h1>
          <p>
            This link works once and expires quickly. After the reset, Hoppers signs you into your account.
          </p>
        </div>

        <div class="signin-card">
          <form id="reset-form" class="account-form">
            <label>
              <span>New password</span>
              <input name="password" required minlength="8" type="password" autocomplete="new-password" placeholder="8+ characters" />
            </label>
            <label>
              <span>Confirm password</span>
              <input name="confirmPassword" required minlength="8" type="password" autocomplete="new-password" placeholder="Repeat password" />
            </label>
            <button class="button button-dark" type="submit">Reset password</button>
            <p id="reset-status" class="form-status" role="status" aria-live="polite"></p>
          </form>
          <p class="auth-helper"><a href="./forgot-password.html">Need a new reset link?</a></p>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./reset-password.js?v=1"></script>
  </body>
</html>
